# Reference configuration for Weather dataset
# Note: Use reproduction script or CLI arguments for exact paper hyperparameters
dataset: weather
seq-len: 96
pred-len: 720
epochs: 50
batch-size: 16
seed: 42
learning-rate: 0.0005
adj-rank: 16
adj-topk: 16
adj-tau: 0.8
self-loop-alpha: 0.2
gate-mode: band
prop-orders: 2
use-temporal-head: true
temporal-head-ratio: 0.3
