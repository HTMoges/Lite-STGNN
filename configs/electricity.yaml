dataset: electricity
seq-len: 96
pred-len: 720
epochs: 100
batch-size: 32
seed: 42
learning-rate: 0.0008
adj-rank: 16
adj-topk: 10
adj-tau: 1.2
self-loop-alpha: 0.2
gate-mode: band
prop-orders: 2
use-temporal-head: true
temporal-head-ratio: 0.5
temporal-head-dropout: 0.1
use-input-residual: true
residual-dropout: 0.1
use-feature-norm: false
